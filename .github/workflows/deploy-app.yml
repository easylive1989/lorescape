name: Deploy App

# 只建置與上架行動 App（Android → Play internal、iOS → TestFlight）。
# 手動觸發。後端與 Supabase migration 走獨立的 deploy-backend.yml；
# 若這次 App 依賴新的 DB schema，請先跑 deploy-backend 再跑本 workflow。
on:
  workflow_dispatch:

jobs:
  # Android 建置與部署
  build-android:
    name: Build & Deploy Android AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # App 建置只用得到 frontend/，但整包 repo 有 239MB（marketing/ 就佔
      # 172MB）。sparse-checkout 只拉 frontend/ 與根目錄檔案，省磁碟也省時間。
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: frontend

      # ubuntu runner image 越更新剩餘空間越少，2026-08-07 的 build 就是在
      # mergeReleaseNativeLibs 階段 ENOSPC 掛掉（見 ISSUES.md）。先清掉這個
      # job 用不到的預裝軟體；df 輸出保留著，方便日後判斷餘裕還剩多少。
      - name: Free disk space
        run: |
          echo "=== 清理前 ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/share/swift /usr/local/share/powershell \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "=== 清理後 ==="
          df -h /

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Android Release Signing
        run: |
          cd android
          # Create keystore from base64 encoded secret
          echo '${{ secrets.ANDROID_RELEASE_KEYSTORE }}' | base64 -d > release-keystore.jks

          # Create keystore.properties if it doesn't exist
          if [ ! -f keystore.properties ]; then
            echo "releaseStorePassword=${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}" >> keystore.properties
            echo "releaseKeyPassword=${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}" >> keystore.properties
            echo "releaseKeyAlias=${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}" >> keystore.properties
            echo "releaseStoreFile=../release-keystore.jks" >> keystore.properties
          fi

      - name: Generate version numbers
        run: |
          START_EPOCH=1735689600  # 2025-01-01 00:00:00 UTC
          CURRENT_EPOCH=$(date +%s)
          VERSION=$(date +%Y%m%d.%H%M)
          BUILD_NUMBER=$((CURRENT_EPOCH - START_EPOCH))
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Generated VERSION: $VERSION"
          echo "Generated BUILD_NUMBER: $BUILD_NUMBER"

      - name: Disk space before build
        run: df -h /

      - name: Build Android App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ env.VERSION }} \
            --build-number=${{ env.BUILD_NUMBER }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }} \
            --dart-define=REVENUECAT_API_KEY_ANDROID=${{ secrets.REVENUECAT_API_KEY_ANDROID }} \
            --dart-define=BACKEND_BASE_URL=https://api.lorescape.app
        env:
          RELEASESTOREPASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASEKEYPASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASEKEYALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASESTOREFILE: ../release-keystore.jks

      # build 失敗時也要印，才知道是不是又把磁碟塞爆
      - name: Disk space after build
        if: ${{ always() }}
        run: df -h /

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          bundler: "2.4.22"
          working-directory: frontend/android

      - name: Install Fastlane
        run: |
          cd android
          bundle install

      - name: Deploy to Google Play Console
        run: |
          cd android
          bundle exec fastlane deploy_internal
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

  # iOS 建置與部署
  build-ios:
    name: Build & Deploy iOS IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # 同 Android job：只拉 frontend/
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: frontend

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      # Xcode 16+/26 ships platforms as on-demand components; the runner's
      # Xcode 26 doesn't have the iOS SDK preinstalled, so a device archive
      # fails with "iOS 26.0 is not installed". Fetch it before building.
      - name: Download iOS platform
        run: xcodebuild -downloadPlatform iOS

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Install the Apple certificate and provisioning profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/Instant_Explore.mobileprovision
          SHARE_PP_PATH=$RUNNER_TEMP/Instant_Explore_ShareExtension.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profiles from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH
          echo -n "$SHARE_EXTENSION_PROVISION_PROFILE_BASE64" | base64 --decode --output $SHARE_PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
          cp $SHARE_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Generate version numbers
        run: |
          START_EPOCH=1735689600  # 2025-01-01 00:00:00 UTC
          CURRENT_EPOCH=$(date +%s)
          VERSION=$(date +%Y%m%d.%H%M)
          BUILD_NUMBER=$((CURRENT_EPOCH - START_EPOCH))
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Generated VERSION: $VERSION"
          echo "Generated BUILD_NUMBER: $BUILD_NUMBER"

      - name: Build iOS IPA
        env:
          DEVELOPMENT_TEAM: T9UXT366P9
        run: |
          flutter build ipa --release \
            --build-name=${{ env.VERSION }} \
            --build-number=${{ env.BUILD_NUMBER }} \
            --export-options-plist ios/Runner/ExportOptions.plist \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }} \
            --dart-define=REVENUECAT_API_KEY_IOS=${{ secrets.REVENUECAT_API_KEY_IOS }} \
            --dart-define=BACKEND_BASE_URL=https://api.lorescape.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          bundler: "2.4.22"
          working-directory: frontend/ios

      - name: Install Fastlane
        run: |
          cd ios
          bundle install

      - name: Create App Store Connect API Key
        run: |
          cd ios
          mkdir -p ~/.appstoreconnect/private_keys/
          echo '${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}' > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Upload to TestFlight
        run: |
          cd ios
          bundle exec fastlane upload_testflight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Clean up keychain and provisioning profiles
        if: ${{ always() }}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/Instant_Explore.mobileprovision
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/Instant_Explore_ShareExtension.mobileprovision

  # 建置狀態報告
  deploy-status:
    name: Deploy Status Report
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always()

    steps:
      - name: Report Status
        run: |
          echo "## 🚀 App 部署狀態報告"
          echo "- Android 建置: ${{ needs.build-android.result }}"
          echo "- iOS 建置: ${{ needs.build-ios.result }}"

          if [ "${{ needs.build-android.result }}" = "success" ] && \
             [ "${{ needs.build-ios.result }}" = "success" ]; then
            echo "✅ App 建置與上架成功完成！"
          else
            echo "❌ 部分建置失敗，請檢查日誌"
            exit 1
          fi
