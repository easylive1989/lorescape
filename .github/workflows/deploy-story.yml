name: Deploy Story

# 視覺小說（story/）部署到 https://story-lorescape.web.app。
#
# 手動觸發，跟 deploy-backend / deploy-app 同一個原則：出貨是決定，不是
# 每次 push 的副作用。
#
# 閘門與本機共用 story/gate.sh，用 --ci 模式跑。
#
# **CI 不做影像處理。** 去背與轉檔要在 125 張圖上跑 Pillow＋numpy，而 CI 上
# 沒有 _processed 快取（那份 568 MB）。所以 WebP 產物直接進版控（18 MB），
# --ci 只用 --verify-only 確認產物與 writer 來源逐字同步、參照的素材都在，
# 然後 analyze → test → build → 部署。
#
# 分工：美術或劇本動了，就在本機重跑匯入並把產物一起 commit；CI 只負責把
# 版控裡這批東西驗過、蓋起來、送上去。忘記重跑會被 --verify-only 擋下。
#
# CI 上沒有 fvm（SDK 由 flutter-action 依 .fvmrc 的版本裝好），所以把
# FLUTTER 環境變數換掉。
#
# 前提：**所有景點包的來源都要在版控裡**。美術定版原圖與 story.json 都已
# 進版控（.gitignore 只擋 _processed/ 快取與匯入產生的 WebP，兩者都會在
# gate.sh 裡重生）。少一包，gate.sh 會硬錯——不是跳過，因為 packs.json 是
# 掃磁碟產生的，缺包等於把少一個景點的書架推上線。
on:
  workflow_dispatch:

jobs:
  deploy-story:
    name: Deploy Story to Firebase Hosting
    runs-on: ubuntu-latest
    # 不做影像處理之後，重頭只剩 pub get、analyze、test 與 build web。
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # 與 story/.fvmrc 一致。改版本時兩邊要一起改。
          flutter-version: "3.38.5"
          channel: "stable"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # --verify-only 只讀 JSON 與檢查檔案存在，但 import_pack.py 在模組層
        # import 了 Pillow 與 numpy，所以還是得裝。pytest 不需要——匯入腳本
        # 測試只在本機跑。
        run: python3 -m pip install --upgrade pillow numpy

      - name: Run the shipping gate
        # 與本機 ./deploy.sh 跑的是同一支腳本；--ci 的差別只有「不做影像處理、
        # 改成驗證版控裡的產物」與「不跑會實際匯入的那組 pytest」。
        env:
          FLUTTER: flutter
        run: ./story/gate.sh --ci

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INSTANT_EXPLORE_7B442 }}
          channelId: live
          projectId: instant-explore-7b442
          target: story
