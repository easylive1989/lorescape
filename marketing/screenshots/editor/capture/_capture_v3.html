<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Lorescape v3 — Capture Harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=Long+Cang&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="app2/ls2.css"/>
<link rel="stylesheet" href="app3/ls3.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" crossorigin="anonymous"></script>
<style>
  html, body { background:#000; height:100%; }
  .stage { position:static; width:var(--capw,390px); height:var(--caph,844px); background:none; display:block; overflow:visible; }
  .phone.capture { width:var(--capw,390px); height:var(--caph,844px); border-radius:0; box-shadow:none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="app2/icons.jsx"></script>
<script type="text/babel" src="app3/icons3.jsx"></script>
<script type="text/babel" src="app2/data.jsx"></script>
<script type="text/babel" src="app3/data3.jsx"></script>
<script type="text/babel" src="app2/ui.jsx"></script>
<script type="text/babel" src="app3/globe.jsx"></script>
<script type="text/babel" src="app2/screens_story.jsx"></script>
<script type="text/babel" src="app2/screens_history.jsx"></script>
<script type="text/babel" src="app3/screens_home.jsx"></script>
<script type="text/babel" src="app3/screens_map.jsx"></script>
<script type="text/babel" data-presets="react">
  const noop = () => {};

  // 行銷截圖用的歷程書架：比照實機為多層書架（每層 4 本），
  // 設計原型仍是單層，故在 harness 內重繪，沿用同一組 CSS class。
  const SHELF_TRIPS = [
    { id:"uncat",  name:"未分類",    count:"12 篇", filled:true },
    { id:"de2020", name:"2020德瑞",  count:"31 篇", filled:true },
    { id:"tk2016", name:"2016東京",  count:"24 篇", filled:true },
    { id:"nz2027", name:"2027紐西蘭", count:"9 篇",  filled:false },
    { id:"kx2018", name:"2018京阪",  count:"16 篇", filled:true },
    { id:"oc2026", name:"2026奧捷",  count:"18 篇", filled:true },
    { id:"is2024", name:"2024冰島",  count:"22 篇", filled:true },
    { id:"pt2023", name:"2023葡萄牙", count:"14 篇", filled:true },
    { id:"kr2022", name:"2022首爾",  count:"11 篇", filled:true },
    { id:"vn2021", name:"2021越南",  count:"7 篇",  filled:false },
    { id:"hk2019", name:"2019北海道", count:"19 篇", filled:true },
    { id:"tr2019", name:"2019土耳其", count:"26 篇", filled:true },
    { id:"ma2018", name:"2018摩洛哥", count:"13 篇", filled:true },
    { id:"es2017", name:"2017西班牙", count:"21 篇", filled:true },
    { id:"no2025", name:"2025挪威",  count:"8 篇",  filled:true },
    { id:"pe2025", name:"2025秘魯",  count:"17 篇", filled:false },
    { id:"gr2024", name:"2024希臘",  count:"23 篇", filled:true },
    { id:"eg2023", name:"2023埃及",  count:"12 篇", filled:true },
    { id:"it2022", name:"2022義大利", count:"29 篇", filled:true },
    { id:"ch2021", name:"2021瑞士",  count:"15 篇", filled:true },
    { id:"jp2020", name:"2020沖繩",  count:"10 篇", filled:true },
    { id:"uk2019", name:"2019蘇格蘭", count:"18 篇", filled:true },
  ];
  function ShelfRow({ books, addSlot }){
    return (
      <div className="shelf">
        <div className="shelf__books">
          {books.map((t, idx)=>(
            <div key={t.id} className={"book book--"+["a","c","b","d"][t.i%4]}
                 style={{height: 190 + (t.i%3)*14}}>
              <div className="book__badge"><window.Icon name={t.filled?"book":"image-off"} size={13}/></div>
              <div className="book__label"><div className="book__title">{t.name}</div></div>
              <div className="book__count">{t.count}</div>
            </div>
          ))}
          {addSlot && (
            <div style={{width:78, height:190, borderRadius:6, alignSelf:"flex-end",
                         border:"2px dashed var(--line)", display:"grid", placeItems:"center",
                         color:"var(--ink-3)", opacity:.85}}>
              <window.Icon name="plus" size={22}/>
            </div>
          )}
        </div>
        <div className="shelf__plank"/>
      </div>
    );
  }
  function HistoryShelfScreen({ perRow=4, total=6 }){
    const { StatusBar, Masthead, Icon } = window;
    const books = SHELF_TRIPS.slice(0, total).map((t,i)=>({...t,i}));
    const rows = [];
    for(let i=0;i<books.length;i+=perRow) rows.push(books.slice(i,i+perRow));
    return (
      <div className="screen fade-enter">
        <StatusBar dark time="8:00"/>
        <div className="screen__scroll">
          <Masthead eyebrow="旅程紀錄 · Chronicle" title="歷程"
            actions={<button className="iconbtn" style={{background:"var(--paper-sunk)"}}><Icon name="plus" size={22}/></button>}/>
          <div className="bookshelf">
            <div className="shelf__cap">旅程書架 · {books.length} 本</div>
            {rows.map((r,ri)=>(
              <ShelfRow key={ri} books={r} addSlot={ri===rows.length-1}/>
            ))}
          </div>
        </div>
      </div>
    );
  }

  const { HomeScreen, PlaceScreen, ReaderView, HistoryScreen, MapScreen } = window;
  const { PLACES, STPETERS_STORY } = window.LS_DATA;
  function screenFor(name){
    switch(name){
      case "home":    return <HomeScreen go={noop}/>;
      case "hooks":   return <PlaceScreen params={{ place: PLACES.find(p=>p.id==="stpeters") }} back={noop}/>;
      case "reader":  return <ReaderView story={STPETERS_STORY} onBack={noop}/>;
      case "history": return <HistoryShelfScreen perRow={+(params.get("perRow")||4)} total={+(params.get("books")||6)}/>;
      case "map":     return <MapScreen params={{mode:"locate"}} back={noop} go={noop} openSheet={noop} saved={["temple"]}/>;
      default:        return <HomeScreen go={noop}/>;
    }
  }
  const params = new URLSearchParams(window.location.search);
  if(params.get("w")){
    document.documentElement.style.setProperty("--capw", params.get("w")+"px");
    document.documentElement.style.setProperty("--caph", params.get("h")+"px");
  }
  const node = screenFor(params.get("screen") || "home");
  function Harness(){
    return (<div className="stage"><div className="phone capture">{node}</div></div>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Harness/>);
</script>
</body>
</html>
