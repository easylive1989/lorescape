name: lorescape_story
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.0.0
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  characters: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    # 書架清單。**這一行漏了的話 packs.json 不會進 bundle**，app 一開就報
    # 「讀不到書架」——目錄項不含父層的散檔。
    - assets/content/
    - assets/content/pompeii-79/
    - assets/content/pompeii-79/assets/backgrounds/
    - assets/content/pompeii-79/assets/sprites/
    - assets/content/pompeii-79/stories/01-harbour-stranger/
    - assets/content/pompeii-79/stories/02-the-oven-went-out/
    - assets/content/pompeii-79/stories/03-the-well-fell/
    - assets/content/pompeii-79/stories/04-the-tree-in-the-sky/
    - assets/content/pompeii-79/stories/05-the-tablets/
    - assets/content/pompeii-79/stories/06-the-locked-door/
    - assets/content/pompeii-79/stories/07-cannot-land/
    - assets/content/pompeii-79/stories/08-the-new-house/
    # 凡爾賽 1789，八篇。app 內從書架頁選，不需要 build flag。
    - assets/content/versailles-1789/
    - assets/content/versailles-1789/assets/backgrounds/
    - assets/content/versailles-1789/assets/sprites/
    - assets/content/versailles-1789/stories/01-the-shutter/
    - assets/content/versailles-1789/stories/02-twenty-kilometres/
    - assets/content/versailles-1789/stories/03-both-sides/
    - assets/content/versailles-1789/stories/04-three-days/
    - assets/content/versailles-1789/stories/05-the-balcony/
    - assets/content/versailles-1789/stories/06-the-milk/
    - assets/content/versailles-1789/stories/07-the-bakers-family/
    - assets/content/versailles-1789/stories/08-no-lamps-tonight/
